<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Una columna: encabezado de marca, 8 secciones numeradas y 2 anexos plegables. Láminas en grilla que cae a 1 columna. */
:root {
  --bg: #f6f3ee; --fg: #2b241d; --muted: #6f6357; --wood: #9a5b2e; --line: #ddd3c6; --card: #fffdf9;
  --ok: #2f6b3a; --okbg: #e3efe3; --bad: #9b2c22; --badbg: #f6e0dc; --warn: #8a5a00; --warnbg: #f5ead2; --view: #f1ece4;
  --display: "Bitter", Georgia, serif; --body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1d1915; --fg: #efe7dc; --muted: #b3a593; --wood: #d08a55; --line: #3a322a; --card: #26211b; --ok: #9fd3a8; --okbg: #22342540; --bad: #f0a59b; --badbg: #4a221d60; --warn: #e8c37a; --warnbg: #47380f60; --view: #2a241e; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1d1915; --fg: #efe7dc; --muted: #b3a593; --wood: #d08a55; --line: #3a322a; --card: #26211b; --ok: #9fd3a8; --okbg: #22342540; --bad: #f0a59b; --badbg: #4a221d60; --warn: #e8c37a; --warnbg: #47380f60; --view: #2a241e; color-scheme: dark }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 56px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
section { min-width: 0 }
header { border-bottom: 2px solid var(--wood); padding-bottom: 14px; margin-bottom: 6px }
.brand { font: 700 .8rem var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--wood); margin: 0 }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; margin: 4px 0 0; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 500; font-size: 1.35rem; margin: 26px 0 10px; display: flex; gap: 10px; align-items: baseline }
h2 .num { font: 700 .85rem var(--body); color: var(--bg); background: var(--wood); border-radius: 999px; min-width: 1.6rem; height: 1.6rem; display: inline-grid; place-items: center }
h3 { font-family: var(--display); font-weight: 500; font-size: 1.08rem; margin: 18px 0 8px }
p { margin: 0 0 10px; max-width: 72ch }
.sub, .hint { color: var(--muted); }
.hint { font-size: .92rem; }
.note { background: var(--card); border-left: 3px solid var(--wood); padding: 10px 12px; border-radius: 6px }
.tbd { color: var(--warn); font-style: italic }
a { color: var(--wood) }
.frame { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.det { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); display: flex; flex-direction: column; }
.det figcaption { padding: 12px 14px 8px; display: grid; gap: 4px; min-width: 0; }
.det figcaption b { font-family: var(--display); font-weight: 500; font-size: 1.05rem; }
.det figcaption span { color: var(--muted); font-size: .92rem; }
.det .pl { margin-top: auto; }
.tabs, .ivat { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 }
.tabs button, .ivat button { font: 600 .95rem var(--body); padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
.tabs button[aria-pressed="true"], .ivat button[aria-pressed="true"] { background: var(--wood); border-color: var(--wood); color: var(--bg); }
button:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }
.viewer { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--view); }
#v3d { width: 100%; aspect-ratio: 4 / 3; max-height: 70vh; touch-action: none; }
#v3d canvas { display: block; width: 100% !important; height: 100% !important }
dl { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 6px 14px; margin: 0; max-width: 860px; }
dt { color: var(--muted); font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding-top: 3px; }
dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
dd ul { margin: 0; padding-left: 18px }
@media (max-width: 520px) { dl { grid-template-columns: 1fr; } dd { margin-bottom: 6px; } h1 { font-size: 1.55rem } }
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--card) }
table { border-collapse: collapse; width: 100%; font-size: .93rem; font-variant-numeric: tabular-nums }
th, td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line) }
th { font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
td small { display: block; color: var(--muted); font-size: .82rem }
td.n { text-align: right; white-space: nowrap }
tr.grp td { font: 700 .78rem var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--wood); background: var(--bg) }
table.tot td { font-size: 1.05rem } table.tot tr.hl td { font-weight: 700; font-size: 1.2rem }
@media (max-width: 560px) {
  table.mat thead { display: none }
  table.mat tr { display: grid; grid-template-columns: 1fr auto; padding: 8px 10px; border-bottom: 1px solid var(--line) }
  table.mat td { border: 0; padding: 2px 0 } table.mat td:first-child, table.mat td:last-child { grid-column: 1 / -1 }
  table.mat tr.grp { display: block } table.mat td.n:nth-child(3) { display: none }
}
.st { display: inline-block; font: 600 .78rem var(--body); padding: 2px 8px; border-radius: 999px; white-space: nowrap }
.st.ok { color: var(--ok); background: var(--okbg) } .st.bad { color: var(--bad); background: var(--badbg) } .st.warn { color: var(--warn); background: var(--warnbg) }
ol.steps { padding-left: 22px; max-width: 76ch } ol.steps li { margin-bottom: 8px }
ul { max-width: 76ch }
details { border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 4px 14px; margin-top: 14px }
details summary { font-family: var(--display); font-size: 1.15rem; padding: 10px 0; cursor: pointer }
footer { color: var(--muted); font-size: .85rem; margin-top: 24px; border-top: 1px solid var(--line); padding-top: 12px }
.pl{--paper:#fbf8f3;--ground:#efe8dc;--wall:#e4dccf;--wallEdge:#b9ad9b;--hole:#d6cab7;--dim:#1f5f8b;--ink:#2b241d;--soil:#e6dccb;--gravel:#d9cfbd}
.pl svg{display:block;width:100%;height:auto}
.pl .ext{stroke:var(--dim);stroke-width:.8;opacity:.7}.pl .dl{stroke:var(--dim);stroke-width:1.2}.pl .arh{fill:var(--dim)}
.pl .dt{fill:var(--dim);font-family:"Source Sans 3",Arial,sans-serif;font-weight:600;paint-order:stroke;stroke:var(--paper);stroke-width:4px}
.pl .tg{fill:var(--ink);font:600 13px "Source Sans 3",Arial,sans-serif;paint-order:stroke;stroke:var(--paper);stroke-width:4px}.pl .ldr{stroke:var(--ink);stroke-width:.8}.pl .dotc{fill:var(--ink)}
.pl .lbl{font:700 13px Arial,sans-serif;letter-spacing:.12em}.pl .soft{fill:#8a7d6c}
.pl .vw{font:700 12px Arial,sans-serif;letter-spacing:.1em;fill:#6f6357}.pl .vw2{font:600 12px "Source Sans 3",Arial,sans-serif;fill:#1f5f8b;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
@media print { .tabs, .ivat, .viewer, .viewer + .hint { display: none } details { break-inside: avoid } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">{{MARCA}}</p>
    <h1>{{H1}}</h1>
    <p class="sub">{{SUB}}</p>
  </header>
  {{CUERPO}}
  <footer>Generado con el plugin «estructuras-a-medida». Medidas en metros con coma decimal. Gráficos: croquis siempre armado.</footer>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const ESCENA = {{ESCENA}};
// pestañas de configuración (perspectiva + 3D)
let cfgActual = document.querySelector(".tabs button")?.dataset.cfg;
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  document.querySelectorAll("[data-persp]").forEach((p) => (p.hidden = p.dataset.persp !== b.dataset.cfg));
  cfgActual = b.dataset.cfg; if (window.armar3d) window.armar3d(cfgActual);
}));
// croquis 3D (z arriba, mm)
(function () {
  const el = document.getElementById("v3d");
  if (!el || !window.THREE) { if (el) el.innerHTML = '<p class="hint" style="padding:16px">No se pudo cargar el visor 3D.</p>'; return; }
  const scene = new THREE.Scene();
  const cam = new THREE.PerspectiveCamera(32, 4 / 3, 50, 60000);
  cam.up.set(0, 0, 1); cam.position.set(6800, -9400, 3600);
  const ren = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  ren.setPixelRatio(Math.min(devicePixelRatio, 2)); el.appendChild(ren.domElement);
  const ctl = new THREE.OrbitControls(cam, ren.domElement);
  ctl.target.set(0, 0, 1050); ctl.enableDamping = true; ctl.maxPolarAngle = Math.PI * 0.49; ctl.minDistance = 2500; ctl.maxDistance = 22000;
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b5a48, 0.85));
  const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(-4000, -6000, 9000); scene.add(sun);
  const MAT = {
    madera: new THREE.MeshStandardMaterial({ color: 0xc98a55, roughness: 0.85 }),
    acero: new THREE.MeshStandardMaterial({ color: 0x9aa3ab, metalness: 0.6, roughness: 0.35 }),
    banda: new THREE.MeshStandardMaterial({ color: 0x8d969e, metalness: 0.6, roughness: 0.4 }),
    oscuro: new THREE.MeshStandardMaterial({ color: 0x454c53, metalness: 0.5, roughness: 0.4 }),
    asiento: new THREE.MeshStandardMaterial({ color: 0x8a5a34, roughness: 0.8 }),
    cama: new THREE.MeshStandardMaterial({ color: 0xd9cbb4, roughness: 0.95 }),
    soga: new THREE.MeshStandardMaterial({ color: 0x9c958a, roughness: 1 }),
  };
  const V = (p) => new THREE.Vector3(p[0], p[1], p[2]);
  function cil(a, b, r, mat, seg = 20) {
    const A = V(a), B = V(b), dir = B.clone().sub(A), L = dir.length();
    const g = new THREE.CylinderGeometry(r, r, L, seg);
    const mesh = new THREE.Mesh(g, mat);
    mesh.position.copy(A.clone().add(B).multiplyScalar(0.5));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
    return mesh;
  }
  // piso, área libre y pozos
  const [ax, ay] = ESCENA.area;
  const piso = new THREE.Mesh(new THREE.PlaneGeometry(ax + 3000, ay + 3000), new THREE.MeshStandardMaterial({ color: 0x9fb48a, roughness: 1 }));
  scene.add(piso);
  const area = new THREE.Mesh(new THREE.PlaneGeometry(ax, ay), new THREE.MeshStandardMaterial({ color: 0xb9c79f, roughness: 1 }));
  area.position.z = 2; scene.add(area);
  const borde = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(ax, ay)), new THREE.LineBasicMaterial({ color: 0x1f5f8b }));
  borde.position.z = 4; scene.add(borde);
  const muro = new THREE.Mesh(new THREE.BoxGeometry(150, ay + 1000, 1800), new THREE.MeshStandardMaterial({ color: 0xe4dccf, roughness: 1 }));
  muro.position.set(-ax / 2 - 75, 0, 900); scene.add(muro);
  ESCENA.pozos.forEach(([x, y]) => { const c = new THREE.Mesh(new THREE.PlaneGeometry(ESCENA.pozo[0], ESCENA.pozo[1]), new THREE.MeshStandardMaterial({ color: 0xd6cab7 })); c.position.set(x, y, 6); scene.add(c); });
  ESCENA.piezas.forEach((p) => scene.add(cil(p.a, p.b, p.r, MAT[p.m] || MAT.madera, p.m === "madera" ? 28 : 16)));
  let grupo = null;
  window.armar3d = function (id) {
    if (grupo) scene.remove(grupo);
    grupo = new THREE.Group();
    (ESCENA.configs[id] || []).forEach((c) => {
      if (c.tipo === "caja") {
        const [x0, x1] = c.x, [y0, y1] = c.y, [z0, z1] = c.z;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), c.nombre === "cama" ? MAT.cama : MAT.asiento);
        mesh.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); grupo.add(mesh);
      } else if (c.tipo === "barra") grupo.add(cil(c.a, c.b, c.r, MAT.acero, 12));
      else if (c.tipo === "soga") grupo.add(cil(c.a, c.b, 7, MAT.soga, 8));
    });
    scene.add(grupo);
  };
  window.armar3d(cfgActual);
  function tam() { const w = el.clientWidth, h = el.clientHeight; ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
  new ResizeObserver(tam).observe(el); tam();
  (function loop() { ctl.update(); ren.render(scene, cam); requestAnimationFrame(loop); })();
})();
</script>
</body>
</html>
